[package]
name = "ryu-places"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local-first shared family map of places to visit and places been for Ryu."
repository = "https://github.com/amajorai/ryu"

[[bin]]
name = "ryu-places"
path = "src/main.rs"

[lib]
name = "ryu_places"
path = "src/lib.rs"

[dependencies]
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.5.0", features = ["handoff"] }
anyhow = "1"
async-trait = "0.1"
axum = "0.7"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.40.0", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Phase-2 content sealing (encb:v1 / RYU-CB01 / blind indexes). No OS keychain
# backend: the key arrives from Core (RYU_SEAL_KEY) or RYU_MASTER_KEY.
ryu-crypto = { path = "../crates/core/crypto", version = "0.5.0", default-features = false, features = ["sqlite-functions"] }
# Encoding and randomness for sidecar_link.rs / store.rs.
base64 = "0.22"
rand = "0.8"

[dev-dependencies]
async-trait = "0.1"
